<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  <div></div>
  <div class="switch">
    <span>Mostrar valores</span>
    <input type="checkbox" id="toggleValues" checked>
    <label for="toggleValues"></label>
  </div>
</div>

<div class="filter-section">
  <small>Filtrar Anos:</small>
  <div id="year-filters" class="year-chips"></div>
</div>

<div class="navigation-section">
  <div id="tabs" class="tab-container"></div>
</div>

<div id="summary-boxes"></div>

<div id="content">
  <div class="table-wrapper">
    <table id="data-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="charts-grid">
    <div class="chart-box">
      <canvas id="main-chart"></canvas>
    </div>
    <div class="chart-box">
      <canvas id="ratio-chart"></canvas>
    </div>
  </div>

  <div class="charts-grid full-width" id="category-chart-container" style="display:none;">
    <div class="chart-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div></div>
        <div class="switch">
          <span style="font-size: 0.8rem; color: #aaa;">Visualizar gastos médios mensais</span>
          <input type="checkbox" id="toggleMonthlyAverages">
          <label for="toggleMonthlyAverages"></label>
        </div>
      </div>
      <canvas id="category-chart"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>

</body>
</html>
